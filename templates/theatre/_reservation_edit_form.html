<form method="post" action="{% url 'reservation_edit' booking.pk %}" data-reservation-edit-form>
{% csrf_token %}
<div class="reservation-edit-summary">
<p><strong>{{ booking.procedure }}</strong></p>
<p><strong>Paciente:</strong> {{ booking.patient_name }} · RUT: {{ booking.patient_rut|default:'No registrado' }}</p>
<p><strong>Cirujano:</strong> {{ booking.doctor }}</p>
</div>
{{ form.as_p }}
<div class="reservation-edit-actions"><button type="button" class="secondary" data-close-reservation-edit>Cancelar</button><button type="submit">Confirmar cambios</button></div>
</form>
