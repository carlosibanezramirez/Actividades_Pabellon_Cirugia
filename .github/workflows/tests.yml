name: Django y PostgreSQL
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pabellon
          POSTGRES_USER: pabellon
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      POSTGRES_HOST: localhost
      POSTGRES_DB: pabellon
      POSTGRES_USER: pabellon
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
      - name: Comprobar configuración de producción
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: ci-only-production-check-key-123456789012345678901234567890
          DJANGO_ALLOWED_HOSTS: app.example.org
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.org
        run: python manage.py check --deploy --fail-level WARNING
